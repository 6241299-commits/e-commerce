
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEasy - E-Commerce Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #222;
        }

        /* NAVBAR */
        header {
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            color: white;
            padding: 15px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #ffd32a;
        }

        .search {
            flex: 1;
            max-width: 500px;
            display: flex;
        }

        .search input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            outline: none;
            border-radius: 25px 0 0 25px;
            font-size: 16px;
        }

        .search button {
            padding: 12px 20px;
            border: none;
            background: #ff9f1a;
            color: white;
            border-radius: 0 25px 25px 0;
            cursor: pointer;
        }

        .cart {
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }

        /* HERO */
        .hero {
            min-height: 480px;
            background:
                linear-gradient(rgba(37,117,252,0.65), rgba(106,17,203,0.65)),
                url("https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1600&q=80");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            padding: 50px 8%;
            color: white;
        }

        .hero-content {
            max-width: 600px;
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #ffd32a;
        }

        .hero p {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .shop-btn {
            display: inline-block;
            padding: 15px 30px;
            background: #ff9f1a;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .shop-btn:hover {
            background: #ff6b00;
            transform: scale(1.05);
        }

        /* CATEGORIES */
        section {
            padding: 60px 7%;
        }

        .title {
            text-align: center;
            font-size: 35px;
            color: #4b2aad;
            margin-bottom: 40px;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .category {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .category:hover {
            transform: translateY(-8px);
        }

        .category-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .category
